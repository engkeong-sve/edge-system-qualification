name: "profile.suite.realtime.proe_control"
description: "PROe control-loop real-time benchmark (optional native PROe backend)"
version: "1.0.0"
# Listed and runnable only when an installed, verified PROe package declares support for this profile.
requires_backend: "proe"
params:
  labels:
    profile_display_name: "Real-Time PROe Control"
    group: "realtime.proe"
    type: "suite"
    display_status: false
  requirements:
    os_type:
      - "linux"

suites:
  - name: "realtime"
    sub_suites:
      - name: "proe"
        tests:
          test_proe:
            params:
              - test_id: "RT-PROE-002"
                display_name: "PROe Control Benchmark"
                description: |
                  Runs the PROe control benchmark profile on this system through the installed PROe package
                  and reports the measured latency, jitter, packet loss and clock synchronization values.
                  Execution success is not qualification: no pass/fail threshold is applied.
                esq_profile: "profile.suite.realtime.proe_control"
                timeout: 3600  # seconds allowed for the PROe run
