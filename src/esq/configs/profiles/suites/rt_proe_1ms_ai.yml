name: "profile.suite.realtime.proe_1ms_ai"
description: "PROe 1 ms AI real-time benchmark (optional native PROe backend)"
version: "1.0.0"
# Listed and runnable only when an installed, verified PROe package declares support for this profile.
requires_backend: "proe"
params:
  labels:
    profile_display_name: "Real-Time PROe 1 ms AI"
    group: "realtime.proe"
    type: "suite"
    display_status: false
  requirements:
    os_type:
      - "linux"

suites:
  - name: "realtime"
    sub_suites:
      - name: "proe"
        tests:
          test_proe:
            params:
              - test_id: "RT-PROE-001"
                display_name: "PROe 1 ms AI Benchmark"
                description: |
                  Runs the PROe 1 ms AI benchmark profile on this system through the installed PROe package
                  and reports the measured latency, jitter, packet loss and clock synchronization values.
                  Execution success is not qualification: no pass/fail threshold is applied.
                esq_profile: "profile.suite.realtime.proe_1ms_ai"
                timeout: 3600  # seconds allowed for the PROe run
